[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data"
version = "1.0.0"
description = "Blue Data Intelligence Layer"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
dependencies = [
    "pandas",
    "numpy",
    "jsonpath-ng",
]

# Each extra has a lower bound at the major the code is written against, so the
# resolver installs a working version (or fails clearly on an unsupported Python)
# rather than an old, unimportable release — e.g. chromadb 0.3.23 on Python 3.15. #225
[project.optional-dependencies]
postgres  = ["psycopg2-binary>=2.9"]
mysql     = ["mysql-connector-python>=8"]
mongodb   = ["pymongo>=4"]
neo4j     = ["neo4j>=5"]
redis     = ["redis>=5,<7"]
chromadb  = ["chromadb>=1.0"]
bn        = ["pgmpy>=0.1.20", "networkx>=3"]
parquet   = ["pyarrow>=14"]
llm       = ["anthropic>=0.40"]
server    = ["fastapi>=0.100"]
dev       = ["pytest>=7", "pytest-cov"]
all = [
    "psycopg2-binary>=2.9",
    "mysql-connector-python>=8",
    "pymongo>=4",
    "neo4j>=5",
    "redis>=5,<7",
    "chromadb>=1.0",
    "pgmpy>=0.1.20",
    "networkx>=3",
    "pyarrow>=14",
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blue_data.utils.config" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]

