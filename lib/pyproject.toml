[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data"
version = "0.1.0"
description = "Blue Data Intelligence Layer"
requires-python = ">=3.10"
authors = [
    {name = "Jalal Mahmud", email = "jalal@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "jalal@megagon.ai"},
]
dependencies = [
    "pandas",
    "numpy",
    "jsonpath-ng",
]

[project.optional-dependencies]
postgres  = ["psycopg2-binary"]
mysql     = ["mysql-connector-python"]
mongodb   = ["pymongo"]
neo4j     = ["neo4j"]
redis     = ["redis"]
chromadb  = ["chromadb"]
bn        = ["pgmpy", "networkx"]
parquet   = ["pyarrow"]
llm       = ["anthropic"]
dev       = ["pytest", "pytest-cov"]
all = [
    "psycopg2-binary",
    "mysql-connector-python",
    "pymongo",
    "neo4j",
    "redis",
    "chromadb",
    "pgmpy",
    "networkx",
    "pyarrow",
    "anthropic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]

