[project]
name = "blue-data-registry-mcp"
version = "0.1.0"
description = "MCP server exposing DataRegistry operations to LLM clients"
requires-python = ">=3.10"
authors = [
    {name = "Jalal Mahmud", email = "jalal@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "jalal@megagon.ai"},
]

dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
redis   = ["redis"]
llm     = ["anthropic", "openai"]
dev     = ["pytest", "pytest-asyncio"]
all     = ["redis", "anthropic", "openai"]

[project.scripts]
blue-data-registry-mcp = "registry_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Add lib to path so `from blue_data.registry.data_registry import DataRegistry` resolves.
# Run: cd platform/registry-mcp && pip install -e ../../lib && pip install -e . && pytest
pythonpath = ["../../lib/src/blue-data", "src"]
testpaths  = ["tests"]
