[project]
name = "blue-registry-cli"
version = "1.0.0"
description = "Command-line interface for blue-data DataRegistry"
requires-python = ">=3.10"
authors = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
redis   = ["redis>=5,<7"]
llm     = ["anthropic", "openai"]
all     = ["redis>=5,<7", "anthropic", "openai"]
dev     = ["pytest"]

[project.scripts]
blue-registry = "registry_cli.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship profile_spec.json inside the wheel — profile.py loads it next to the
# module, so a non-editable install fails every command without this.
registry_cli = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["../../lib/src/blue-data", "src"]
testpaths  = ["tests"]
