[project]
name = "blue-data-json-mcp"
version = "1.0.0"
description = "MCP server exposing raw JSONSource operations (memory and file backends)"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]

dependencies = [
    "blue-data>=1.0,<2",
    # <2: mcp 2.x removed mcp.server.fastmcp; >=1.28.1: skip the 1.27.x advisory.
    "mcp[cli]>=1.28.1,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blue-data-json-mcp = "json_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["../../lib/src/blue-data", "src"]
testpaths  = ["tests"]
