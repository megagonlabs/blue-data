[project]
name = "blue-data-cli"
version = "0.1.0"
description = "Command-line interface for blue-data DataRegistry"
requires-python = ">=3.10"

dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
redis   = ["redis"]
llm     = ["anthropic", "openai"]
all     = ["redis", "anthropic", "openai"]
dev     = ["pytest"]

[project.scripts]
blue-data = "registry_cli.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["../../lib/src/blue-data", "src"]
testpaths  = ["tests"]
